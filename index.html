<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Unit 4 - Flexbox</title>
    <style>
      .fantasy{
        background-color: cornflowerblue;
        display: flex;
        justify-content: space-around;
        align-items: center;
      }
      .book-items{
        background-color: rgb(245, 220, 238);
        width: 100px;
        height: 150px;
      }
      .The{
        background-color: cornflowerblue;
        display: flex;
        justify-content: space-around;
        align-items: center;
      }
      .the-items{
         background-color: beige;
        width: 100px;
        height: 150px;
      }
      .j{
         background-color: cornflowerblue;
        display: flex;
        justify-content: space-around;
        align-items: center;
      }
      .j-items{
        background-color: rgb(89, 0, 255);
        width: 100px;
        height: 150px;
      }
    </style>
  </head>
  <body>
    <center><h1>Cozy Reads</h1></center>
<div class="fantasy">
      <img
        src="https://images-na.ssl-images-amazon.com/images/S/compressed.photo.goodreads.com/books/1654581271i/61242426.jpg"
        width="200"
      />
      <p class="book-items">
        It’s not easy to build a coffee shop in a place that has never had
        coffee before. #CozyFantasy
      </p>
</div>
<div class="The">
    <img
      src="https://images-na.ssl-images-amazon.com/images/S/compressed.photo.goodreads.com/books/1569514209i/45047384.jpg"
      width="200"
    />
    <p class="the-items">
      The main character must oversee an inspection of a house for magical
      children. #CozyFantasy
    </p>
</div>
<div class="j">
    <img
      src="https://images-na.ssl-images-amazon.com/images/S/compressed.photo.goodreads.com/books/1601307658i/53310061.jpg"
      width="200"
    />
    <p class="j-items">
      Who better to help cover up an accidental murder than overly protective
      aunties. #CozyMystery
    </p></div>
  </body>
</html>
